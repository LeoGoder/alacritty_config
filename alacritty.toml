  # "catppuccin-frappe.toml"
  # "catppuccin-macchiato.toml"
  "catppuccin-mocha.toml"
]


[window]
decorations = "Full"
opacity = 0.90
# blur = true
decorations_theme_variant = "Dark"

[font]
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# [colors.primary]
# background = '#1a1b26'

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true
